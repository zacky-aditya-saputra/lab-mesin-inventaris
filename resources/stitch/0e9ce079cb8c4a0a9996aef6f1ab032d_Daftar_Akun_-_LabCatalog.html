<body class="bg-surface text-on-surface font-body-md min-h-screen flex flex-col">
<!-- TopNavBar (Nav suppressed as per mandate for linear/transactional intent, but instructed to use TopNavBar. I will render it minimally as a brand anchor without nav links to satisfy both constraints) -->
<header class="bg-surface dark:bg-inverse-surface fixed top-0 w-full z-50 border-b border-outline-variant dark:border-outline shadow-sm flex justify-between items-center h-16 px-gutter-md mx-auto">
<div class="font-headline-sm text-headline-sm text-primary dark:text-primary-fixed-dim font-bold">
            LabCatalog
        </div>
<a class="font-label-md text-label-md text-primary dark:text-primary-fixed-dim hover:text-primary-container transition-colors duration-200" href="#">
            Masuk
        </a>
</header>
<main class="flex-grow flex items-center justify-center p-margin-page mt-16 pt-12 pb-12">
<div class="bg-surface-container-lowest rounded-xl shadow-sm border border-outline-variant/30 w-full max-w-md p-padding-card">
<div class="mb-8 text-center">
<h1 class="font-headline-md text-headline-md text-on-surface mb-2">Daftar Akun Baru</h1>
<p class="font-body-md text-body-md text-on-surface-variant">Lengkapi data di bawah ini untuk mulai menggunakan layanan peminjaman alat.</p>
</div>
<form class="space-y-5">
<div>
<label class="block font-label-md text-label-md text-on-surface mb-1" for="nama_lengkap">Nama Lengkap</label>
<input class="w-full rounded-lg border-outline-variant bg-surface-container-lowest text-on-surface font-body-md text-body-md focus:border-primary-container focus:ring-primary-container shadow-sm" id="nama_lengkap" name="nama_lengkap" placeholder="Contoh: Budi Santoso" type="text"/>
</div>
<div>
<label class="block font-label-md text-label-md text-on-surface mb-1" for="email">Email Address</label>
<input class="w-full rounded-lg border-outline-variant bg-surface-container-lowest text-on-surface font-body-md text-body-md focus:border-primary-container focus:ring-primary-container shadow-sm" id="email" name="email" placeholder="mahasiswa@univ.edu" type="email"/>
</div>
<div>
<label class="block font-label-md text-label-md text-on-surface mb-1" for="password">Password</label>
<input aria-describedby="password-error" aria-invalid="true" class="w-full rounded-lg border-error bg-surface-container-lowest text-on-surface font-body-md text-body-md focus:border-error focus:ring-error shadow-sm" id="password" name="password" type="password"/>
<p class="mt-1 font-caption-xs text-caption-xs text-error" id="password-error">Password minimal 8 karakter</p>
</div>
<div>
<label class="block font-label-md text-label-md text-on-surface mb-1" for="password_confirmation">Konfirmasi Password</label>
<input class="w-full rounded-lg border-outline-variant bg-surface-container-lowest text-on-surface font-body-md text-body-md focus:border-primary-container focus:ring-primary-container shadow-sm" id="password_confirmation" name="password_confirmation" type="password"/>
</div>
<div class="pt-4">
<button class="w-full bg-primary-container hover:bg-primary-container/90 text-on-primary-container font-label-md text-label-md py-2.5 px-4 rounded-lg shadow-sm transition-colors duration-200" type="button">
                        Daftar
                    </button>
</div>
</form>
<div class="mt-6 text-center font-body-md text-body-md">
<span class="text-on-surface-variant">Sudah punya akun?</span>
<a class="text-primary-container font-medium hover:underline ml-1" href="#">Masuk</a>
</div>
</div>
</main>
<!-- Footer -->
<footer class="bg-sidebar-dark dark:bg-black w-full mt-auto flex flex-col md:flex-row justify-between items-center py-8 px-gutter-md max-w-container-max mx-auto">
<div class="font-headline-sm text-headline-sm text-primary-fixed mb-4 md:mb-0">
            LabCatalog
        </div>
<div class="font-caption-xs text-caption-xs text-surface-variant opacity-70 mb-4 md:mb-0">
            © 2024 University Laboratory Inventory System
        </div>
<nav class="flex gap-4">
<a class="font-caption-xs text-caption-xs text-surface-variant opacity-70 hover:opacity-100 transition-opacity" href="#">Kebijakan Privasi</a>
<a class="font-caption-xs text-caption-xs text-surface-variant opacity-70 hover:opacity-100 transition-opacity" href="#">Syarat &amp; Ketentuan</a>
<a class="font-caption-xs text-caption-xs text-surface-variant opacity-70 hover:opacity-100 transition-opacity" href="#">Bantuan</a>
</nav>
</footer>
</body></html>
